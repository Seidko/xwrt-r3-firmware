# 旁路由 AP 透明代理：让跨桥流量走三层 netfilter 钩子
#
# 拓扑：R3 与主路由同 SSID 漫游、同网段桥接。连 R3 无线的设备，其流量以 L2
# 桥接方式"从 R3 无线进、从 R3 LAN 口出"穿过 R3。默认情况下三层 nftables
# prerouting 看不到这种桥接流，透明代理无从下手。
#
# br_netfilter 提供 net.bridge.* 开关：置 1 后，桥接的 IPv4/IPv6 包会同时经过
# 对应网络命名空间的三层钩子（nftables 的 ip/ip6/inet 表 prerouting 可见），
# 从而只对"物理上穿过 R3"（= 连 R3 无线的设备）的流量做透明代理；
# 主路由侧设备流量不进入 R3，天然不受影响。
#
# 前提：kmod-br-netfilter 已装（config/r3-minimal.seed 里已选 CONFIG_PACKAGE_kmod-br-netfilter）
net.bridge.bridge-nf-call-iptables=1
net.bridge.bridge-nf-call-ip6tables=1
